# PIPELINE DEFINITION
# Name: btc-seven-day-forecast-training
# Inputs:
#    period: str [Default: '5y']
components:
  comp-generate-features:
    executorLabel: exec-generate-features
    inputDefinitions:
      parameters:
        input_csv:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
        output_csv:
          parameterType: STRING
  comp-ingest-btc-data:
    executorLabel: exec-ingest-btc-data
    inputDefinitions:
      parameters:
        period:
          defaultValue: 5y
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
        output_csv:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      parameters:
        feature_csv:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
        model_artifact:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-generate-features:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_features
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \ 'numpy==2.2.6' 'scikit-learn==1.7.2' 'yfinance==0.2.66' 'joblib==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_features(input_csv: dsl.InputPath(str), output_csv:\
          \ dsl.OutputPath(str)) -> int:\n    import pandas as pd\n\n    data = pd.read_csv(input_csv,\
          \ parse_dates=[\"Date\"], index_col=\"Date\")\n    close = data[\"Close\"\
          ].astype(float)\n    for lag in (1, 2, 3, 7, 14, 30):\n        data[f\"\
          lag_{lag}\"] = close.shift(lag)\n    data[\"ma_7\"] = close.shift(1).rolling(7).mean()\n\
          \    data[\"ma_30\"] = close.shift(1).rolling(30).mean()\n    data[\"volatility_7\"\
          ] = close.pct_change().shift(1).rolling(7).std(ddof=0)\n    data[\"momentum_7\"\
          ] = close.shift(1) / close.shift(7) - 1.0\n    data[\"target\"] = close\n\
          \    data = data.dropna()\n    data.to_csv(output_csv)\n    return len(data)\n\
          \n"
        image: python:3.10-slim
    exec-ingest-btc-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_btc_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \ 'numpy==2.2.6' 'scikit-learn==1.7.2' 'yfinance==0.2.66' 'joblib==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_btc_data(output_csv: dsl.OutputPath(str), period: str\
          \ = \"5y\") -> int:\n    import pandas as pd\n    import yfinance as yf\n\
          \n    frame = yf.download(\"BTC-USD\", period=period, interval=\"1d\", progress=False)\n\
          \    if isinstance(frame.columns, pd.MultiIndex):\n        frame.columns\
          \ = frame.columns.get_level_values(0)\n    frame = frame[[\"Open\", \"High\"\
          , \"Low\", \"Close\", \"Volume\"]].dropna()\n    if len(frame) < 120:\n\
          \        raise ValueError(\"Insufficient market history\")\n    frame.to_csv(output_csv,\
          \ index_label=\"Date\")\n    return len(frame)\n\n"
        image: python:3.10-slim
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \ 'numpy==2.2.6' 'scikit-learn==1.7.2' 'yfinance==0.2.66' 'joblib==1.5.2'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.6'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(feature_csv: dsl.InputPath(str), model_artifact:\
          \ dsl.OutputPath(str)) -> float:\n    import joblib\n    import numpy as\
          \ np\n    import pandas as pd\n    from sklearn.ensemble import HistGradientBoostingRegressor\n\
          \n    columns = [\n        \"lag_1\",\n        \"lag_2\",\n        \"lag_3\"\
          ,\n        \"lag_7\",\n        \"lag_14\",\n        \"lag_30\",\n      \
          \  \"ma_7\",\n        \"ma_30\",\n        \"volatility_7\",\n        \"\
          momentum_7\",\n    ]\n    data = pd.read_csv(feature_csv)\n    train, validation\
          \ = data.iloc[:-7], data.iloc[-7:]\n    model = HistGradientBoostingRegressor(max_iter=300,\
          \ random_state=24)\n    model.fit(train[columns], train[\"target\"])\n \
          \   predicted = model.predict(validation[columns])\n    mape = float(np.mean(np.abs((validation[\"\
          target\"] - predicted) / validation[\"target\"])) * 100)\n    if mape >\
          \ 25:\n        raise ValueError(f\"Model rejected because MAPE {mape:.3f}\
          \ exceeded 25\")\n    model.fit(data[columns], data[\"target\"])\n    joblib.dump({\"\
          model\": model, \"feature_columns\": columns, \"mape\": mape}, model_artifact)\n\
          \    return mape\n\n"
        image: python:3.10-slim
        resources:
          cpuRequest: 0.5
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryRequest: 1Gi
pipelineInfo:
  name: btc-seven-day-forecast-training
root:
  dag:
    tasks:
      generate-features:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-features
        dependentTasks:
        - ingest-btc-data
        inputs:
          parameters:
            input_csv:
              taskOutputParameter:
                outputParameterKey: output_csv
                producerTask: ingest-btc-data
        taskInfo:
          name: generate-features
      ingest-btc-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-btc-data
        inputs:
          parameters:
            period:
              componentInputParameter: period
        taskInfo:
          name: ingest-btc-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - generate-features
        inputs:
          parameters:
            feature_csv:
              taskOutputParameter:
                outputParameterKey: output_csv
                producerTask: generate-features
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      period:
        defaultValue: 5y
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
