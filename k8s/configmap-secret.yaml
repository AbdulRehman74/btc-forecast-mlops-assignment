apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  namespace: btc-forecast
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_PATH: "/app/models/btc_forecast.joblib"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secrets
  namespace: btc-forecast
type: Opaque
stringData:
  MODEL_RELOAD_TOKEN: "replace-before-deployment"
  MARKET_API_KEY: "not-required-for-yfinance"

