<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #10243e; }
      .label { font: 700 20px Arial, sans-serif; fill: #10243e; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #2b6cb0; stroke-width: 3; rx: 16; }
      .orch { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 3; rx: 16; }
      .deploy { fill: #f0fdf4; stroke: #15803d; stroke-width: 3; rx: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700" y="55" text-anchor="middle" class="title">Production Bitcoin Forecasting MLOps Architecture</text>

  <rect x="55" y="125" width="220" height="110" class="box"/>
  <text x="165" y="165" text-anchor="middle" class="label">BTC-USD Provider</text>
  <text x="165" y="197" text-anchor="middle" class="body">Daily OHLCV market data</text>

  <rect x="340" y="105" width="290" height="150" class="orch"/>
  <text x="485" y="145" text-anchor="middle" class="label">Airflow Daily DAG</text>
  <text x="485" y="180" text-anchor="middle" class="body">Fetch and validate</text>
  <text x="485" y="207" text-anchor="middle" class="body">Engineer features and retrain</text>
  <text x="485" y="234" text-anchor="middle" class="body">Evaluate and reload API</text>

  <rect x="710" y="105" width="280" height="150" class="box"/>
  <text x="850" y="145" text-anchor="middle" class="label">Model Registry Volume</text>
  <text x="850" y="180" text-anchor="middle" class="body">Versioned joblib artifact</text>
  <text x="850" y="207" text-anchor="middle" class="body">MAE RMSE MAPE metadata</text>
  <text x="850" y="234" text-anchor="middle" class="body">Atomic acceptance gate</text>

  <rect x="1065" y="105" width="280" height="150" class="deploy"/>
  <text x="1205" y="145" text-anchor="middle" class="label">Flask Prediction API</text>
  <text x="1205" y="180" text-anchor="middle" class="body">Gunicorn non-root container</text>
  <text x="1205" y="207" text-anchor="middle" class="body">Health predict metrics</text>
  <text x="1205" y="234" text-anchor="middle" class="body">Validated JSON responses</text>

  <path d="M275 180 L340 180" class="arrow"/>
  <path d="M630 180 L710 180" class="arrow"/>
  <path d="M990 180 L1065 180" class="arrow"/>

  <rect x="55" y="365" width="290" height="150" class="orch"/>
  <text x="200" y="405" text-anchor="middle" class="label">Kubeflow Pipeline</text>
  <text x="200" y="440" text-anchor="middle" class="body">Container components</text>
  <text x="200" y="467" text-anchor="middle" class="body">Portable compiled YAML</text>
  <text x="200" y="494" text-anchor="middle" class="body">Reproducible ML workflow</text>

  <rect x="420" y="345" width="360" height="190" class="deploy"/>
  <text x="600" y="387" text-anchor="middle" class="label">Kubernetes Deployment</text>
  <text x="600" y="425" text-anchor="middle" class="body">3 initial replicas and rolling updates</text>
  <text x="600" y="454" text-anchor="middle" class="body">Liveness and readiness probes</text>
  <text x="600" y="483" text-anchor="middle" class="body">ConfigMap Secret and PVC</text>
  <text x="600" y="512" text-anchor="middle" class="body">Requests limits and security context</text>

  <rect x="855" y="345" width="240" height="190" class="deploy"/>
  <text x="975" y="387" text-anchor="middle" class="label">Traffic Layer</text>
  <text x="975" y="425" text-anchor="middle" class="body">ClusterIP service</text>
  <text x="975" y="454" text-anchor="middle" class="body">NodePort 30080</text>
  <text x="975" y="483" text-anchor="middle" class="body">NGINX Ingress</text>
  <text x="975" y="512" text-anchor="middle" class="body">btc-forecast.local</text>

  <rect x="1170" y="365" width="175" height="150" class="box"/>
  <text x="1258" y="408" text-anchor="middle" class="label">Clients</text>
  <text x="1258" y="443" text-anchor="middle" class="body">REST consumers</text>
  <text x="1258" y="470" text-anchor="middle" class="body">Locust load</text>

  <path d="M345 440 L420 440" class="arrow"/>
  <path d="M780 440 L855 440" class="arrow"/>
  <path d="M1095 440 L1170 440" class="arrow"/>
  <path d="M1205 255 L1205 320 L600 320 L600 345" class="arrow"/>

  <rect x="260" y="625" width="880" height="75" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="14"/>
  <text x="700" y="657" text-anchor="middle" class="label">GitHub Actions CI/CD and Container Registry</text>
  <text x="700" y="684" text-anchor="middle" class="body">Black and Flake8 → Pytest → KFP compile → SHA and latest image tags</text>
  <path d="M700 625 L700 550 L600 550 L600 535" class="arrow"/>
</svg>

